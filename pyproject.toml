[project]
name = "whodunit-stylometry"
version = "0.1.0"
description = "Modelado estilístico de la novela de misterio - Un análisis computacional de autores canónicos"
authors = [
    {name = "Teresa García Ceva", email = "tgarciace@uoc.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "black (>=26.1.0,<27.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]

# Pre-commit hooks
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

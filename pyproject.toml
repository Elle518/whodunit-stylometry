[tool.poetry]
name = "whodunit-stylometry"
version = "0.1.0"
description = "Modelado estilístico de la novela de misterio - Un análisis computacional de autores canónicos"
readme = "README.md"
authors = ["Teresa García Ceva <tgarciace@uoc.edu>"]
packages = [{ include = "whodunit_stylometry", from = "src" }]


[tool.poetry.dependencies]
python = ">=3.11,<3.14"

pandas = ">=2.2,<3.1"
numpy = ">=2.0,<2.5"
matplotlib = ">=3.8,<3.11"
seaborn = ">=0.13,<0.14"
spacy = ">=3.8,<4"
nltk = ">=3.9,<4"
scipy = ">=1.16,<1.18"
unidecode = "^1.4.0"
ipywidgets = "^8.1.8"
plotly = "^6.6.0"
nbformat = "^5.10.4"
scikit-learn = ">=1.7,<1.9"
shap = "^0.50.0"
numba = ">=0.61,<0.62"
llvmlite = ">=0.44,<0.46"
pyarrow = "^23.0.1"
fastparquet = "^2026.3.0"
rpy2 = "^3.6.7"
statsmodels = "^0.14.6"


[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
ruff = ">=0.15,<0.16"
black = ">=26.1,<27"
pre-commit = ">=4.5,<5"
ipykernel = ">=7.1,<8"



[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120
target-version = ["py311"]


[tool.ruff]
line-length = 120
target-version = "py311"
